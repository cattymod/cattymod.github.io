h1 {
    font-size: 28px;
    font-weight: normal;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));

}

.card {
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    background: #fafafa;
    transition: background 0.15s, border-color 0.15s;
}

.card:hover {
    background: #eee;
    border-color: #999;
}

.preview {
    width: 32px;
    height: 32px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
}

a {
    color: #0000EE;
    text-decoration: none;
    font-size: 14px;
}

a:hover {
    text-decoration: underline;
}

hr {
    border: none;
    border-top: 1px solid #999;
    margin: 20px 0;
}

footer {
    color: #555;
    font-size: 13px;
}
</style>
</head>
