<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scratch-gui commits</title>
<style>
    :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --panel-hover: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --link: #58a6ff;
        --footer: #010409;
        --success: #3fb950;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
        padding-bottom: 76px;
    }

    .wrap {
        width: min(100% - 32px, 980px);
        margin: 0 auto;
        padding: 32px 0 24px;
    }

    header {
        margin-bottom: 20px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 600;
    }

    .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
    }

    .status {
        margin: 18px 0;
        color: var(--muted);
        font-size: 14px;
    }

    .commit-list {
        display: grid;
        gap: 10px;
    }

    .commit {
        display: block;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        transition: background 120ms ease, border-color 120ms ease;
    }

    .commit:hover,
    .commit:focus-visible {
        background: var(--panel-hover);
        border-color: #484f58;
        outline: none;
    }

    .message {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.45;
        overflow-wrap: anywhere;
    }

    .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 12px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
    }

    .sha {
        color: var(--link);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .verified {
        color: var(--success);
    }

    .error {
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid #f85149;
        border-radius: 8px;
        color: #ff7b72;
    }

    .loading {
        color: var(--muted);
        padding: 20px 0;
    }

    footer {
        position: fixed;
        z-index: 100;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        background: rgba(1, 4, 9, 0.96);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(8px);
    }

    footer a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 7px;
        background: #238636;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    footer a:hover,
    footer a:focus-visible {
        background: #2ea043;
        outline: 2px solid #58a6ff;
        outline-offset: 2px;
    }

    @media (max-width: 600px) {
        .wrap {
            width: min(100% - 20px, 980px);
            padding-top: 22px;
        }

        h1 {
            font-size: 24px;
        }

        .commit {
            padding: 14px;
        }
    }
</style>
</head>
<body>
<main class="wrap">
    <header>
        <h1>cattymod/scratch-gui</h1>
        <p class="subtitle">Latest 25 commits</p>
    </header>

    <div id="status" class="status">Loading commits...</div>
    <section id="commits" class="commit-list" aria-live="polite"></section>
</main>

<footer>
    <a href="https://github.com/cattymod/scratch-gui/commits" target="_blank" rel="noopener noreferrer">
        View More on GitHub
    </a>
</footer>

<script>
const API_URL = "https://api.github.com/repos/cattymod/scratch-gui/commits?per_page=25";
const commitsElement = document.getElementById("commits");
const statusElement = document.getElementById("status");

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function formatDate(isoDate) {
    const date = new Date(isoDate);
    if (Number.isNaN(date.getTime())) return isoDate;

    return date.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

async function loadCommits() {
    try {
        const response = await fetch(API_URL, {
            headers: {
                "Accept": "application/vnd.github+json"
            }
        });

        if (!response.ok) {
            throw new Error(`GitHub API returned ${response.status}`);
        }

        const commits = await response.json();

        if (!Array.isArray(commits) || commits.length === 0) {
            statusElement.textContent = "No commits found.";
            return;
        }

        statusElement.textContent = `${commits.length} commits loaded`;

        commitsElement.innerHTML = commits.map(commit => {
            const message = commit.commit?.message?.split("\n")[0] || "No commit message";
            const author = commit.commit?.author?.name || commit.author?.login || "Unknown author";
            const date = commit.commit?.author?.date || commit.commit?.committer?.date || "";
            const sha = (commit.sha || "").slice(0, 7);
            const verified = commit.commit?.verification?.verified;

            return `
                <a class="commit"
                   href="${escapeHTML(commit.html_url)}"
                   target="_blank"
                   rel="noopener noreferrer">
                    <div class="message">${escapeHTML(message)}</div>
                    <div class="meta">
                        <span>${escapeHTML(author)}</span>
                        <span>${escapeHTML(formatDate(date))}</span>
                        <span class="sha">${escapeHTML(sha)}</span>
                        ${verified ? '<span class="verified">✓ Verified</span>' : ""}
                    </div>
                </a>
            `;
        }).join("");
    } catch (error) {
        console.error(error);
        statusElement.textContent = "";
        commitsElement.innerHTML = `
            <div class="error">
                Could not load commits from GitHub. Please check your connection or try again later.
            </div>
        `;
    }
}

loadCommits();
</script>
</body>
</html>
