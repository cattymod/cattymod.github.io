<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Connecting to CattyMod">

  <title>Connecting • CattyMod</title>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      color-scheme: dark;

      --background: #111318;
      --card: #191c23;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f5f7fb;
      --muted: #969daa;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(59, 130, 246, 0.14),
          transparent 42%
        ),
        var(--background);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;

      padding: 42px 38px 36px;

      background: rgba(25, 28, 35, 0.92);
      border: 1px solid var(--card-border);
      border-radius: 22px;

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(255, 255, 255, 0.015);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;

      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      border-radius: 50%;

      background: #20242c;
      border: 1px solid rgba(255, 255, 255, 0.1);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28),
        0 0 0 7px rgba(59, 130, 246, 0.05);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0;

      font-size: 25px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 10px auto 0;

      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .spinner {
      width: 20px;
      height: 20px;

      margin: 27px auto 0;

      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--blue);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    .footer {
      margin-top: 29px;

      color: #6f7580;
      font-size: 11px;
      line-height: 1.5;
    }

    .error {
      display: none;

      margin-top: 22px;
      padding: 12px 14px;

      border-radius: 10px;

      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);

      color: #fca5a5;
      font-size: 13px;
      line-height: 1.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 16px;
      }

      .login-card {
        padding: 34px 24px 30px;
        border-radius: 18px;
      }

      .logo {
        width: 78px;
        height: 78px;
      }

      h1 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.5s;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="login-card" aria-live="polite">

      <div class="logo">
        <img
          src="https://studio.cattymod.app/images/apple-touch-icon.png"
          alt="CattyMod"
        >
      </div>

      <h1 id="title">Connecting you...</h1>

      <p class="subtitle" id="subtitle">
        Please wait while we connect your Scratch account.
      </p>

      <div class="spinner" id="spinner"></div>

      <div class="error" id="error"></div>

      <div class="footer">
        <strong>CattyMod</strong> · By Noahscratch493
      </div>

    </section>
  </main>

  <script>
    async function connect() {
      const params = new URLSearchParams(window.location.search);
      const privateCode = params.get("privateCode");

      if (!privateCode) {
        throw new Error("No private code was provided.");
      }

      // Verify the private code first.
      const verifyUrl =
        "https://auth.itinerary.eu.org/api/auth/verifyToken/" +
        encodeURIComponent(privateCode);

      const response = await fetch(verifyUrl);

      if (!response.ok) {
        throw new Error("Unable to verify your connection.");
      }

      const data = await response.json();

      if (!data.valid) {
        throw new Error("Your connection is invalid or has expired.");
      }

      // The code is valid, so pass it to the main CattyMod site.
      const callbackUrl =
        "https://cattymod.app/"

      document.getElementById("title").textContent =
        "Connection verified!";

      document.getElementById("subtitle").textContent =
        "Going back to homepage...";

      setTimeout(() => {
        window.location.href = callbackUrl;
      }, 300);
    }

    function showError(message) {
      document.getElementById("title").textContent =
        "Connection failed";

      document.getElementById("subtitle").textContent =
        "We couldn't connect your Scratch account.";

      document.getElementById("spinner").style.display = "none";

      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    connect().catch(showError);
  </script>
</body>
</html>
