<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CattyMod Editor</title>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.25), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.2), transparent 35%),
        linear-gradient(135deg, #eff6ff, #dbeafe);
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 25px 70px rgba(30, 64, 175, 0.18),
        0 8px 25px rgba(15, 23, 42, 0.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.3);
    }

    .icon svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(25px, 5vw, 32px);
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin: 10px 0 30px;
      text-align: center;
      color: #64748b;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .editor-button {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      background: white;
      color: #172554;
      text-align: left;
      cursor: pointer;
      font: inherit;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .editor-button:hover {
      transform: translateY(-3px);
      border-color: #93c5fd;
      background: #f8fbff;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.13);
    }

    .editor-button:active {
      transform: translateY(-1px);
    }

    .button-icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      color: #2563eb;
      background: #eff6ff;
    }

    .button-icon svg {
      width: 22px;
      height: 22px;
    }

    .button-text {
      flex: 1;
    }

    .button-title {
      display: block;
      font-size: 16px;
      font-weight: 700;
    }

    .button-description {
      display: block;
      margin-top: 3px;
      color: #64748b;
      font-size: 13px;
    }

    .arrow {
      color: #94a3b8;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .editor-button:hover .arrow {
      color: #2563eb;
      transform: translateX(4px);
    }

    .footer {
      margin-top: 26px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
        border-radius: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon">
      <i data-lucide="blocks"></i>
    </div>

    <h1>Which editor are you trying to access?</h1>
    <p class="subtitle">
      Choose the CattyMod editor you want to open.
    </p>

    <div class="buttons">

      <button
        class="editor-button"
        onclick="location.href='https://studio.cattymod.app'"
      >
        <div class="button-icon">
          <i data-lucide="palette"></i>
        </div>

        <div class="button-text">
          <span class="button-title">CattyMod Studio</span>
          <span class="button-description">The latest editor experience</span>
        </div>

        <i class="arrow" data-lucide="arrow-up-right"></i>
      </button>

      <button
        class="editor-button"
        onclick="location.href='https://beta.cattymod.app'"
      >
        <div class="button-icon">
          <i data-lucide="flask-conical"></i>
        </div>

        <div class="button-text">
          <span class="button-title">Beta</span>
          <span class="button-description">Try upcoming features</span>
        </div>

        <i class="arrow" data-lucide="arrow-up-right"></i>
      </button>

      <button
        class="editor-button"
        onclick="location.href='https://cattymod.app/previous'"
      >
        <div class="button-icon">
          <i data-lucide="history"></i>
        </div>

        <div class="button-text">
          <span class="button-title">Previous</span>
          <span class="button-description">Access the previous editor that uses Scrooch 3</span>
        </div>

        <i class="arrow" data-lucide="arrow-up-right"></i>
      </button>

    </div>

    <div class="footer">
      CattyMod
    </div>

  </main>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
