<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>403 - Embed</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #232B2F;
}

/* FULL FLEX FILL */
.wrap {
  width: 100%;
  height: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 12px;
  box-sizing: border-box;
}

/* SIMPLE LAYOUT (NO CARD UI) */
.content {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;

  gap: 16px;

  color: #ffffff;
}

/* ICON */
.icon {
  width: min(20%, 80px);
  height: auto;
}

/* TEXT */
.text {
  display: flex;
  flex-direction: column;
  justify-content: center;

  max-width: 70%;
}

.title {
  font-size: clamp(14px, 2.5vw, 20px);
  font-weight: bold;
}

.desc {
  font-size: clamp(11px, 2vw, 14px);
  opacity: 0.75;
  margin-top: 4px;
}

.tag {
  margin-top: 6px;
  font-size: 11px;
  opacity: 0.5;
}

/* RESPONSIVE STACKING FOR TINY HEIGHTS */
@media (max-height: 140px) {
  .content {
    flex-direction: column;
    text-align: center;
    gap: 8px;
  }

  .icon {
    width: 40px;
  }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="content">

    <img class="icon" src="https://cattymod.app/assets/dango/phone.svg" alt="CattyMod">

    <div class="text">
      <div class="title">Explore is blocked</div>
      <div class="desc">This could be due to being on a school device or having an outdated browser.

</div>
      <div class="tag">403</div>
    </div>

  </div>
</div>

</body>
</html>
