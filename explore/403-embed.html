<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>403 - CattyMod Embed</title>

<style>
html, body {
  margin: 0;
  height: 300px;
  overflow: hidden;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* CENTER WRAPPER */
.wrap {
  height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;

  background: transparent;
  padding: 10px;
  box-sizing: border-box;
}

/* CARD */
.card {
  width: 100%;
  max-width: 700px;

  display: flex;
  align-items: center;
  gap: 14px;

  background: #232B2F;
  color: #fff;

  padding: 14px 16px;
  border-radius: 12px;

  box-shadow: 0 6px 18px rgba(0,0,0,0.4);
}

/* ICON */
.card img {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

/* TEXT */
.text {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.text strong {
  font-size: 16px;
}

.text span {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 3px;
}

/* small tag */
.tag {
  margin-top: 6px;
  font-size: 11px;
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <img src="https://cattymod.app/assets/dango/phone.svg" alt="CattyMod">

    <div class="text">
      <strong>Explore is blocked</strong>
      <span>This could be due to being on a school device or having an outdated browser.</span>
      <div class="tag">403 • Embedded view</div>
    </div>

  </div>
</div>

</body>
</html>
