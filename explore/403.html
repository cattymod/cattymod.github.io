<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>403 - CattyMod Explore</title>

<style>
html, body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* SAME STYLE AS YOUR FULLPAGE */
.fullpage {
  background: #f0f2f5;
  color: #333;

  display: flex;
  min-height: 100vh;

  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  padding: 20px;
}

.fullpage img {
  width: 70%;
  max-width: 260px;
  margin-bottom: 20px;
  animation: float 2s ease-in-out infinite;
}

.fullpage h1 {
  font-size: 3rem;
  margin: 0;
  color: #ff6f61;
}

.fullpage p {
  font-size: 1.2rem;
  margin: 10px 0 25px;
  color: #555;
}

.home-btn {
  background: #ff6f61;
  color: white;
  padding: 12px 22px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.home-btn:hover {
  background: #ff4c3b;
}

/* animation */
@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<div class="fullpage">

  <img src="https://cattymod.app/assets/dango/phone.svg" alt="CattyMod character">

  <h1>403</h1>

  <p>
    We couldn't load the explore page.<br>
    This could be due to being on a school device or having an outdated browser.
  </p>

  <a class="home-btn" href="https://cattymod.app">Home</a>

</div>

</body>
</html>
