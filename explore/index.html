<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CattyMod Community</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .padlet-container {
      width: 100%;
      height: 100vh;
    }

    .padlet-container iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
  </style>
</head>

<body>
  <div class="padlet-container">
    <iframe
      src="https://padlet.com/embed/fzzxxm3jc7xg9xf5"
      title="CattyMod Community"
      allow="camera; microphone; geolocation; display-capture; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
