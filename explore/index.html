<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CattyMod - Explore</title>

    <script src="https://cattymod.app/assets/navbar.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .padlet-embed {
            width: 100%;
            height: calc(100dvh - var(--top-offset, 0px));
            position: relative;
            background: #F4F4F4;
        }

        .padlet-embed iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="padlet-embed">
        <iframe
            src="https://padlet.com/embed/fzzxxm3jc7xg9xf5"
            allow="camera; microphone; geolocation; display-capture; clipboard-write">
        </iframe>
    </div>

    <script>
        function updatePadletHeight() {
            const navbar = document.querySelector('.cattymod-navbar-wrapper');
            const notice = document.querySelector('.cattymod-external-notice');

            let offset = 0;

            if (navbar) {
                offset += navbar.getBoundingClientRect().height;
            }

            if (notice) {
                offset += notice.getBoundingClientRect().height;
            }

            document.documentElement.style.setProperty(
                '--top-offset',
                offset + 'px'
            );
        }

        // Wait for navbar.js to insert its elements
        window.addEventListener('load', () => {
            updatePadletHeight();

            const observer = new MutationObserver(updatePadletHeight);

            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style']
            });

            window.addEventListener('resize', updatePadletHeight);
        });
    </script>

</body>
</html>
