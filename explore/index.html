<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CattyMod - Explore</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB8AAAAgCAYAAADqgqNBAA...">
<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background-image: url("https://trampoline.turbowarp.org/avatars/20269294");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>
<body>
<iframe id="explore-frame" src="https://cattymod-explore.lovable.app"></iframe>

<!-- inside cattymod-explore.lovable.app HTML or a script tag -->
<script>
  window.addEventListener("message", (event) => {
    // Security: only allow messages from your trusted parent
    // For testing you can use "*"
    // Replace "*" with your actual parent origin for production
    if (event.origin !== "*" && !event.origin.includes("your-site.com")) return;

    const msg = event.data;

    if (msg.action === "openProject" && msg.sb3_url) {
      console.log("Received project to open:", msg.name, msg.sb3_url);

      // Load project in your CattyMod viewer
      // Example if you have an iframe with id "viewer-frame"
      const viewer = document.getElementById("viewer-frame");
      if (viewer) {
        viewer.src = `https://studio.cattymod.app/?project_url=${encodeURIComponent(msg.sb3_url)}`;
      } else {
        // fallback: open in a new tab
        window.open(`https://studio.cattymod.app/?project_url=${encodeURIComponent(msg.sb3_url)}`, "_blank");
      }
    }
  });
</script>
</body>
</html>
