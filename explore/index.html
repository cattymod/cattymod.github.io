<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CattyMod - Explore</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB8AAAAgCAYAAADqgqNBAA...">
<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background-image: url("https://trampoline.turbowarp.org/avatars/20269294");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>
<body>
<iframe id="explore-frame" src="https://cattymod-explore.lovable.app"></iframe>

<script>
  const iframe = document.getElementById("explore-frame");

  if (!(iframe instanceof HTMLIFrameElement)) {
    throw new Error("Iframe not found or invalid");
  }

  // Listen for messages from the iframe
  window.addEventListener("message", (event) => {
    // Accept messages from the CattyMod Explore iframe
    if (!event.origin.includes("cattymod-explore.lovable.app")) return;

    const message = event.data;

    if (message.action === "navigate") {
      // Navigate iframe to new URL
      iframe.src = message.url;
    }

    if (message.action === "alert") {
      alert(message.text);
    }

    if (message.action === "openProject") {
      // Example: open project SB3 inside the iframe's editor
      console.log("Received project SB3:", message.sb3_url, message.name);

      // Send message into iframe to trigger editor load
      iframe.contentWindow?.postMessage(
        {
          action: "loadSB3",
          sb3_url: message.sb3_url,
          name: message.name
        },
        "https://cattymod-explore.lovable.app"
      );
    }
  });

  // Function to send messages to the iframe
  function sendMessageToIframe(data) {
    iframe.contentWindow?.postMessage(data, "https://cattymod-explore.lovable.app");
  }
</script>
</body>
</html>
