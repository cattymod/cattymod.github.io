<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlet</title>

    <script src="https://cattymod.app/assets/navbar.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .padlet-embed {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            background: #F4F4F4;
        }

        .padlet-embed iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="padlet-embed">
        <iframe
            src="https://padlet.com/embed/fzzxxm3jc7xg9xf5"
            allow="camera; microphone; geolocation; display-capture; clipboard-write">
        </iframe>
    </div>

</body>
</html>
