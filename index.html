  <meta property="og:image" content="https://raw.githubusercontent.com/cattymod/desktop/refs/heads/main/Screenshot%202026-04-10%20095307.png">

  <meta name="twitter:title" content="CattyMod — Block-based coding that works">
  <meta name="twitter:description" content="CattyMod is a Scratch mod for block-based coding that works. Based on Scratch and powered by Scrooch 3.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/cattymod/desktop/refs/heads/main/Screenshot%202026-04-10%20095307.png">

  <script type="module" crossorigin src="/assets/index-vJNnzzXk.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-ZHZclPUs.css">
</head>

<body>
  <div id="root"></div>

  <!-- Removes target iframe and More Tools button -->
  <script>
    (function () {
      const TARGET_IFRAME = "cattymod-explore.lovable.app/embed";
      const TARGET_LINK = "https://www.cattymod.app/hub";

      function removeTargets() {
        // Remove iframe
        document.querySelectorAll("iframe").forEach((iframe) => {
          const src = iframe.getAttribute("src") || "";
          if (src.includes(TARGET_IFRAME)) {
            iframe.remove();
          }
        });

        // Remove More Tools button
        document.querySelectorAll("a").forEach((link) => {
          const href = link.getAttribute("href") || "";
          const text = (link.textContent || "").trim();

          if (
            (href === TARGET_LINK || href === TARGET_LINK + "/") &&
            text.includes("More Tools")
          ) {
            link.remove();
          }
        });
      }

      window.addEventListener("load", removeTargets);

      const observer = new MutationObserver(() => {
        removeTargets();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>

  <!-- message-based redirect system (keeps app navigation working) -->
  <script>
    window.addEventListener("message", (event) => {
      if (event.origin !== "https://cattymod.app") return;

      if (event.data?.action === "redirect" && event.data?.url) {
        window.location.href = event.data.url;
      }
    });
  </script>

</body>
