<body>
  <div id="root"></div>

  <!-- SAFE iframe blocker (only removes the target embed) -->
  <script>
    (function () {
      const TARGET = "cattymod-explore.lovable.app/embed";

      function removeIframe() {
        document.querySelectorAll("iframe").forEach((iframe) => {
          const src = iframe.getAttribute("src") || "";
          if (src.includes(TARGET)) {
            iframe.remove();
          }
        });
      }

      // Run after page load
      window.addEventListener("load", removeIframe);

      // Watch for React or scripts adding it later
      const observer = new MutationObserver(() => {
        removeIframe();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>

  <!-- message-based redirect system (keeps app navigation working) -->
  <script>
    window.addEventListener("message", (event) => {
      if (event.origin !== "https://cattymod.app") return;

      if (event.data?.action === "redirect" && event.data?.url) {
        window.location.href = event.data.url;
      }
    });
  </script>

</body>
