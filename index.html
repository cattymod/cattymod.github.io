<script>
(function () {
    const TARGET_SRC = "https://cattymod-explore.lovable.app/embed";

    function removeIframe() {
        document.querySelectorAll("iframe").forEach((iframe) => {
            if (
                iframe.src &&
                iframe.src.includes("cattymod-explore.lovable.app/embed")
            ) {
                iframe.remove();
            }

            // extra safety: sometimes src is empty but attribute exists
            if (
                iframe.getAttribute("src") &&
                iframe.getAttribute("src").includes("cattymod-explore.lovable.app/embed")
            ) {
                iframe.remove();
            }
        });
    }

    // Run constantly (this is what actually prevents re-injection)
    setInterval(removeIframe, 50);

    // Also run on DOM changes (React / JS reinserts)
    const observer = new MutationObserver(removeIframe);
    observer.observe(document.documentElement, {
        childList: true,
        subtree: true
    });

    // Initial cleanup
    window.addEventListener("load", removeIframe);
})();
</script>
