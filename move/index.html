<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CattyMod Redirect</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background-color: #0f172a;
  }

  /* Background iframe with gentle zoom and blur animation */
  #bg-iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    border: none;
    z-index: 0;
    filter: blur(5px) brightness(0.6);
    transform: scale(1);
    animation: bgZoom 30s infinite alternate ease-in-out;
  }

  @keyframes bgZoom {
    0% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.02) translateY(-10px); }
    100% { transform: scale(1) translateY(0); }
  }

  /* Dark overlay with blur */
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15,23,42,0.65);
    backdrop-filter: blur(6px);
    z-index: 1;
  }

  /* Centered floating card */
  #message-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #ffffff;
    border-radius: 2rem;
    padding: 50px 40px;
    max-width: 450px;
    width: 90%;
    text-align: center;
    z-index: 2;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    animation: floatCard 6s ease-in-out infinite, fadeIn 1s forwards;
    opacity: 0;
  }

  @keyframes floatCard {
    0%, 100% { transform: translate(-50%, -50%) translateY(0); }
    50% { transform: translate(-50%, -50%) translateY(-15px); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  #message-box h1 {
    font-size: 1.9rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: #111827;
    animation: slideUp 1s forwards;
  }

  #message-box p {
    font-size: 1.05rem;
    margin-bottom: 2rem;
    color: #4b5563;
    line-height: 1.6;
    animation: slideUp 1s forwards 0.2s;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #message-box button {
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
    color: #ffffff;
    padding: 0.85rem 2.5rem;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 1.25rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(59,130,246,0.4);
  }

  #message-box button:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 15px 40px rgba(59,130,246,0.55);
    background: linear-gradient(90deg, #60a5fa, #3b82f6);
  }

  /* Accent span color */
  .accent { color: #3b82f6; }
</style>
</head>
<body>

<!-- Background iframe -->
<iframe id="bg-iframe" src="https://cattymod.github.io/move/bgiframe.html" scrolling="no"></iframe>

<!-- Dark overlay -->
<div id="overlay"></div>

<!-- Floating message box -->
<div id="message-box">
  <h1>CattyMod.github.io is now <span class="accent">CattyMod.app</span>!</h1>
  <p>We've unlocked new features for you as a thank you for trying the new site!</p>
  <button onclick="window.location.href='https://www.cattymod.app'">Go Home!</button>
</div>

</body>
</html>
